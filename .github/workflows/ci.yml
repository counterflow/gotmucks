name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Everything that needs no tmux: build, vet, and the hermetic test suite.
  # Runs on the oldest supported Go so that a newer-than-1.22 construct
  # slipping in is caught here rather than by a user.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Build with cgo disabled
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Confirm there are no non-stdlib dependencies
        run: |
          if [ -s go.sum ]; then
            echo "go.sum is not empty; this library takes no external dependencies"
            cat go.sum
            exit 1
          fi

      - name: Test
        run: go test -count=1 ./...

      - name: Test under the race detector
        # -short, and the two steps rather than one raced sweep, because the
        # command tests re-execute this binary as a stand-in tmux and under
        # -race every launch pays instrumented startup: the sweep took 150s
        # where these two take about 19s together. The split loses no
        # coverage. What -race is for is the control-mode half — a reader
        # goroutine, per-pane taps, the event stream, Close — and every one of
        # those tests runs over in-memory pipes and starts no process, so
        # -short keeps all of them. What it skips is argv assembly and output
        # parsing: one goroutine calling a subprocess, with no race to find,
        # and already run in full by the step above.
        run: go test -race -short -count=1 ./...

  # Integration tests against real tmux. 3.2 is the floor, for new-session -e.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tmux: ['3.2a', '3.4', '3.5a']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libevent-dev libncurses-dev bison pkg-config

      - name: Cache the tmux build
        id: tmux-cache
        uses: actions/cache@v4
        with:
          path: ~/tmux-install
          key: tmux-${{ matrix.tmux }}-${{ runner.os }}

      - name: Build tmux ${{ matrix.tmux }}
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          version='${{ matrix.tmux }}'
          curl -fsSL -o tmux.tar.gz \
            "https://github.com/tmux/tmux/releases/download/${version}/tmux-${version}.tar.gz"
          tar xzf tmux.tar.gz
          cd "tmux-${version}"
          ./configure --prefix="$HOME/tmux-install"
          make -j"$(nproc)"
          make install

      - name: Report the tmux under test
        run: |
          echo "$HOME/tmux-install/bin" >> "$GITHUB_PATH"
          "$HOME/tmux-install/bin/tmux" -V

      - name: Probe tmux behaviour
        # Not assertions: these print how this release actually behaves, so
        # that a matrix failure comes with the evidence next to it. The one
        # exception is run in the step below.
        run: |
          bash ./scripts/probe-tmux.sh "$HOME/tmux-install/bin/tmux" || true
          bash ./scripts/probe-control.sh "$HOME/tmux-install/bin/tmux" || true
          bash ./scripts/probe-startup.sh "$HOME/tmux-install/bin/tmux" || true
          bash ./scripts/probe-argv.sh "$HOME/tmux-install/bin/tmux" || true
          bash ./scripts/probe-formats.sh "$HOME/tmux-install/bin/tmux" || true
          bash ./scripts/probe-blocks.sh "$HOME/tmux-install/bin/tmux" || true
          bash ./scripts/probe-tabs.sh "$HOME/tmux-install/bin/tmux" || true
          bash ./scripts/probe-interleave.sh "$HOME/tmux-install/bin/tmux" || true
          bash ./scripts/probe-size.sh "$HOME/tmux-install/bin/tmux" || true
          bash ./scripts/probe-dollar.sh "$HOME/tmux-install/bin/tmux" || true

      - name: Integration tests
        # Ahead of the two assertions below rather than after them, because
        # they abort at their first failed claim and a failing step ends the
        # job: on 3.4 and 3.5a the suite had therefore never run at all, and
        # what the package does on those releases was unknown rather than
        # bad. The assertions still fail the job; they just no longer decide
        # whether anything is learned from the run.
        run: |
          GOTMUCKS_TMUX="$HOME/tmux-install/bin/tmux" \
            go test -tags integration -race -count=1 -timeout 15m ./...

      - name: Check the notification table against this tmux
        # This one is an assertion, and is run for its exit status. A
        # notification name this release can write that the reader's table does
        # not have is an event the library silently loses, and no test can
        # catch it: the unit suite feeds the reader lines it spells itself, so
        # the table is only ever asserted against itself there. The probe scans
        # the binary's format strings and collects what a live server emits,
        # and exits non-zero if either set has a name the table lacks.
        #
        # It also asserts what a notification carries, which is the same kind
        # of claim: that a name arrives vis(3)-escaped, so the reader is right
        # to decode one, and that a substitution still takes a raw newline out
        # of a subscription value, which is the remedy Subscribe documents for
        # a value that would otherwise forge a second protocol line.
        run: bash ./scripts/probe-notify.sh "$HOME/tmux-install/bin/tmux"

      - name: Check the round trip against this tmux
        # An assertion too, and for the same reason: what tmux escapes on the
        # way in and on the way out is a claim about tmux, and a unit test can
        # only assert the package's own spelling of it back at itself. This
        # sends values through a real server and reads them back, and exits
        # non-zero if this release escapes a byte the decoder does not undo,
        # stops expanding one of the five arguments the package doubles the
        # '#' in, starts expanding the command vector, changes which of the
        # name arguments it escapes, or will not substitute a newline out of a
        # value.
        run: bash ./scripts/probe-roundtrip.sh "$HOME/tmux-install/bin/tmux"

  # The escaping of pane output is the single most test-worthy piece of
  # parsing here, so it gets a fuzzing pass of its own on every run.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Fuzz the output escaping round trip
        run: |
          go test ./internal/escape/ -run xxx -fuzz FuzzRoundTrip -fuzztime 60s
          go test ./internal/escape/ -run xxx -fuzz FuzzUnescapeArbitrary -fuzztime 60s

  # Static analysis beyond go vet: staticcheck, errcheck, ineffassign, unused.
  # Which linters and why is in .golangci.yml.
  #
  # Its own job rather than a step in check, which runs twice across the Go
  # matrix and would install the tool twice for no extra signal — the linters
  # ask about the code, not about the toolchain building it.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install golangci-lint
        # From source at a pinned version rather than through the marketplace
        # action, so the version CI runs is the one .golangci.yml was written
        # against — its config format changed between v1 and v2 — and moves
        # when this line moves rather than on someone else's release cadence.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Lint
        run: golangci-lint run ./...
